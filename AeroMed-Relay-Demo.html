  /* ---------- tokens (named by purpose, never by hue) ---------- */
  :root {
    color-scheme: light dark;
    --font-body: "Segoe UI Variable Text", "Segoe UI", system-ui, -apple-system, Roboto, "Helvetica Neue", Arial, sans-serif;
    --font-head: "Cairo", var(--font-body);
    --bg:#ECEFF4; --surface:#FFFFFF; --inset:#F4F6FA; --line:#D8DDE7; --line-strong:#737E95;
    --ink:#161B26; --muted:#4F596D;
    --accent:#0F5F66; --accent-strong:#0A4A50; --accent-soft:#DCF0F0; --on-accent:#FFFFFF;
    --pop:#D9A93F; --pop-ink:#2A1F05;
    --good:#17623F; --good-bg:#DFF2E8; --warn:#7A4B00; --warn-bg:#FFEFC9; --danger:#A32626; --danger-bg:#FBE3E3; --info:#1F4E80; --info-bg:#E1ECF8; --neutral:#454E61; --neutral-bg:#E8EBF1;
    --radius:16px; --radius-sm:12px; --shadow:0 1px 2px rgba(22,27,38,.06), 0 4px 14px rgba(22,27,38,.06);
    --sel:#B9E0E0;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg:#0D111B; --surface:#161C2B; --inset:#1E2538; --line:#2B3550; --line-strong:#6C7EAE;
      --ink:#E8EBF3; --muted:#A5AEC4;
      --accent:#4FD1C5; --accent-strong:#8EE6DD; --accent-soft:#123A3C; --on-accent:#04211F;
      --pop:#E2B24D; --pop-ink:#2A1F05;
      --good:#74D3A2; --good-bg:#16382A; --warn:#F2C877; --warn-bg:#3A2D10; --danger:#FF9D9D; --danger-bg:#431D1F; --info:#8FC0F2; --info-bg:#1A2F49; --neutral:#B8C0D3; --neutral-bg:#252D42;
      --shadow:none; --sel:#1D5558;
    }
  }

  /* ---------- base ---------- */
  *, *::before, *::after { box-sizing:border-box; }
  html { scroll-padding-top:16px; scroll-padding-bottom:96px; -webkit-text-size-adjust:100%; }
  body { margin:0; background:var(--bg); color:var(--ink); font:400 16px/1.5 var(--font-body); overflow-x:clip; overflow-wrap:anywhere; }
  ::selection { background:var(--sel); color:var(--ink); }
  a { color:var(--accent); text-underline-offset:3px; text-decoration-thickness:1.5px; }
  p { margin:0 0 12px; text-wrap:pretty; }
  h1, h2, h3 { font-family:var(--font-head); color:var(--ink); text-wrap:balance; margin:0; }
  h1 { font-size:28px; line-height:1.2; font-weight:800; }
  h2 { font-size:20px; line-height:1.3; font-weight:700; }
  h3 { font-size:17px; line-height:1.3; font-weight:700; margin:20px 0 8px; }
  ul { margin:4px 0 12px; padding-inline-start:22px; }
  li { margin:4px 0; }
  .muted { color:var(--muted); font-size:14px; }
  .ic { width:20px; height:20px; flex:none; fill:none; stroke:currentColor; stroke-width:1.75; stroke-linecap:round; stroke-linejoin:round; }
  .skip { position:absolute; inset-inline-start:12px; top:-60px; z-index:100; background:var(--accent); color:var(--on-accent); padding:10px 16px; border-radius:var(--radius-sm); font-weight:700; text-decoration:none; }
  .skip:focus { top:12px; }
  .vh { position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap; }
  :focus-visible { outline:3px solid var(--accent); outline-offset:2px; border-radius:6px; }
  .hero :focus-visible, .hero a:focus-visible { outline-color:var(--on-accent); }

  /* ---------- controls ---------- */
  button, input, select { font:inherit; color:inherit; }
  button { cursor:pointer; display:inline-flex; align-items:center; justify-content:center; gap:8px; min-height:44px; padding:0 16px; border-radius:var(--radius-sm); border:1.5px solid var(--accent); background:transparent; color:var(--accent); font-weight:700; text-align:center; line-height:1.25; }
  button.primary { background:var(--accent); color:var(--on-accent); }
  button.quiet { border-color:transparent; }
  button.gold { background:var(--pop); border-color:var(--pop); color:var(--pop-ink); }
  button.danger { border-color:var(--danger); color:var(--danger); }
  button.danger.solid { background:var(--danger); color:var(--surface); }
  button.light { background:var(--on-accent); border-color:var(--on-accent); color:var(--accent); }
  button:disabled { cursor:not-allowed; background:var(--inset); border:1.5px dashed var(--line-strong); color:var(--ink); }
  @media (hover:hover) {
    button:not(:disabled):not(.primary):not(.gold):not(.light):not(.solid):hover { background:var(--accent-soft); }
    button.primary:not(:disabled):hover { background:var(--accent-strong); }
    button.danger:not(:disabled):not(.solid):hover { background:var(--danger-bg); }
    button.gold:not(:disabled):hover, button.light:not(:disabled):hover { filter:brightness(.94); }
  }
  button:not(:disabled):active { transform:translateY(1px); }
  label { display:block; font-weight:600; font-size:14px; color:var(--muted); margin:14px 0 6px; }
  input, select { width:100%; min-height:44px; padding:0 12px; border-radius:var(--radius-sm); border:1.5px solid var(--line-strong); background:var(--surface); color:var(--ink); }

  /* Medical Evidence Journey: a vertical timeline, the same at every width */

  }

// ---------- measures (formulas from the report, Appendix D) ----------
function measures() {
  const reviewed = S.cases.filter(c => c.issuedAt && c.items.length && c.items.every(i => i.firstReview));

// ---------- Medical Evidence Journey (stages worked out from the case data) ----------
const PILOT_OPEN = ["requested", "incomplete", "moreinfo"];   // the pilot still has to send something
function dur(ms) {
  if (ms < 3600e3) return "under 1 hour";
  if (ms < DAY) { const h = Math.round(ms / 3600e3); return h + (h === 1 ? " hour" : " hours"); }
  const d = r1(ms / DAY); return d + (d === 1 ? " day" : " days");
}
function journey(c) {
  const its = c.items, lastDoc = i => i.docs.length ? i.docs[i.docs.length - 1].at : 0;
  const allIn = its.every(i => i.state === "received" || i.state === "complete"), allDone = its.every(i => i.state === "complete");
  const inAt = allIn ? Math.max(...its.map(lastDoc)) : null, revAt = allDone ? Math.max(...its.map(i => i.reviewedAt || 0)) : null;
  const pilot = ui.role === "app" ? "You" : appName(c) + " (pilot)";
  const stages = [
    { k: "issue", name: "Request issued", who: c.ame + " (AME)", start: c.created, end: c.issuedAt },
    { k: "gather", name: "Pilot gathers and sends the evidence", who: pilot, start: c.issuedAt, end: inAt },
    { k: "review", name: "AME reviews the evidence", who: c.ame + " (AME)", start: inAt, end: revAt },
    { k: "submit", name: "Formal submission through the KCAA channel (outside RECM)", who: c.ame + " (AME)", start: revAt, end: c.closedAt }
  ];
  const now = stages.find(s => !s.end);
  stages.forEach(s => { s.state = s.end ? "done" : s === now ? "now" : "next"; });

    if (waiting.length) next.push(`${c.ame} (AME): review ${waiting.map(i => i.type).join(", ")}.`);
    if (allDone) next.push(`${c.ame} (AME): submit through the existing KCAA channel, then close the case in RECM.`);

    <ol class="jl">${j.stages.map(li).join("")}<li class="j-${c.closedAt ? "done" : "next"}" data-stage="closed"><span class="jd" aria-hidden="true">${c.closedAt ? ico("check") : ""}</span><div><b>Closed</b><span class="vh"> (${c.closedAt ? "Done" : "Not started"})</span><div class="jt">${c.closedAt ? `${fmtD(c.closedAt)} · ${dur(c.closedAt - c.issuedAt)} in total` : `${dur(S.clock - c.issuedAt)} since the request was issued`}</div></div></li></ol>
    <div class="jnext" id="jNext"><b>${ico("next")}${app ? "What happens next" : "Next action"}</b><ul>${j.next.map(x => `<li>${esc(x)}</li>`).join("")}</ul>
    <div class="muted" id="jOut">Outstanding evidence: ${j.missing.length ? `${j.missing.length} of ${c.items.length} item${c.items.length === 1 ? "" : "s"} (${j.missing.map(i => esc(i.type) + ", " + ITEMSTATE[i.state].toLowerCase()).join("; ")})` : "none"}${j.returns ? ` · sent back to the pilot ${j.returns} time${j.returns === 1 ? "" : "s"}` : ""}</div></div>`;
  if (app) {
    const r1x = rules(c)[0];
    if (r1x.state !== "off") h += `<p class="muted mt" id="jRem">${r1x.state === "on" ? `A reminder by ${PROFILE[c.appId][2]} was due on ${fmtD(r1x.t)}` : `If evidence is still missing on ${fmtD(r1x.t)}, you get a reminder by ${PROFILE[c.appId][2]}`}. Simulated: no message is sent in this demo.</p>`;
  }
  return h + "</section>";
}
// Staff only: the rules table, folded, shown after the checklist
function rulesHtml(c) {
  const rs = rules(c), on = rs.filter(x => x.state === "on").length;
  return `<details class="how" id="rules"><summary>Reminder and escalation rules · ${on ? `${on} ${on === 1 ? "applies" : "apply"} now` : "none apply now"}</summary>
      <div class="tw"><table id="rulesTable" class="stack"><thead><tr><th>Rule</th><th>When</th><th>Goes to</th><th>For this case</th></tr></thead><tbody>
      ${rs.map(x => `<tr data-rule="${x.r.id}" data-state="${x.state}">${td("Rule", `${x.r.id} ${esc(x.r.name)}`, "ttl")}${td("When", esc(x.r.when))}${td("Goes to", esc(x.r.to(c)))}${td("For this case", x.state === "on" ? `<span class="tag t-on">${esc(x.text)}</span>` : esc(x.text))}</tr>`).join("")}
      </tbody></table></div><p>Simulated: RECM shows when each rule applies. No SMS or email is sent. Sending real messages is future work and needs an approved channel.</p></details>`;
}

const TABS = { ame: [["project", "Project"], ["cases", "Cases"], ["pilots", "Pilots"], ["dash", "Dashboard"], ["measures", "Measures"], ["audit", "Audit log"]],
  coord: [["project", "Project"], ["cases", "Cases"], ["pilots", "Pilots"], ["dash", "Dashboard"], ["measures", "Measures"], ["audit", "Audit log"]],
  app: [["project", "Project"], ["cases", "My requests"], ["profile", "My profile"]] };
const SECTAB = { audit: 0, measures: 1, project: 2 };
const TABICON = { project: "project", cases: "cases", pilots: "user", profile: "user", dash: "dash", measures: "measures", audit: "audit" };
function render() {
  document.querySelectorAll(".roles button").forEach(b => b.setAttribute("aria-pressed", b.dataset.role === ui.role));
  const p = PEOPLE[ui.role];
  $("#who").innerHTML = `Signed in as <b>${esc(p.name)}</b>, ${esc(p.title)}`;
  $("#clock").textContent = "Demo clock: " + fmt(S.clock);
  if (!TABS[ui.role].some(t => t[0] === ui.tab)) ui.tab = "cases";
  // Staff: Project, Measures and Audit log sit behind "More" on a phone or tablet (CSS); --k = place in the More sheet, counted from the bottom
  const staff = ui.role !== "app";
  $("#tabs").classList.remove("open");
  $("#tabs").innerHTML = TABS[ui.role].map(([k, n]) => `<button data-tab="${k}"${staff && k in SECTAB ? ` class="sec" style="--k:${SECTAB[k]}"` : ""}${ui.tab === k ? ' aria-current="page"' : ""}>${ico(TABICON[k])}<span>${n}</span></button>`).join("")
    + (staff ? `<button id="moreBtn" class="more${ui.tab in SECTAB ? " on" : ""}" aria-expanded="false">${ico("more")}<span>More</span></button>` : "");
  const m = $("#main");
  if (ui.tab === "project") m.innerHTML = viewProject();
  else if (ui.tab === "cases") m.innerHTML = viewCases();
  else if (ui.tab === "pilots") m.innerHTML = viewPilots();
  else if (ui.tab === "profile") m.innerHTML = `<div class="ph"><div><h1>My profile</h1><p>The details RECM holds about you, your requests and who has worked on your record.</p></div></div><section class="card" id="profile">${profile(ME_APP, true)}</section>`;
  else if (ui.tab === "dash") m.innerHTML = viewDash();
  else if (ui.tab === "measures") m.innerHTML = viewMeasures();
  else m.innerHTML = viewAudit();
  document.title = TABS[ui.role].find(t => t[0] === ui.tab)[1] + " · AeroMed Relay RECM demo";
  renderWt();
}

function viewCases() {
  const cs = visibleCases();
  if (ui.sel && !cs.some(c => c.id === ui.sel)) ui.sel = null;
  if (!ui.sel && ui.role === "app" && cs.length) ui.sel = cs[0].id;
  const head = ui.role === "app" ? "My requests" : "Cases";
  const sub = ui.role === "app" ? "Your requests for extra medical evidence. Open one to see what to send." : ui.role === "ame" ? "Evidence requests you issue. Open a case to see its checklist, review documents or close it." : "Open cases and their evidence checklists. Open a case to log a follow-up.";
  const rows = cs.map(c => `<button class="row" data-id="${c.id}" data-act="pick"${c.id === ui.sel ? ' aria-current="true"' : ""}>
      <span class="av" aria-hidden="true">${c.appId ? esc(initials(appName(c))) : ico("file")}</span>
      <span class="rb">
        <span class="l1"><span class="id">${c.id}</span>${isOverdue(c) ? '<span class="over">Overdue</span>' : ""}</span>
        <span class="l2">${ui.role === "app" ? "Requested by " + esc(c.ame) : esc(appName(c)) + " · " + esc(c.cls)} · due ${c.due ? fmtD(c.due) : "not set"}</span>
        ${ui.role !== "app" ? `<span class="l2">Owner: ${c.owner ? esc(c.owner) : "none"}</span>` : ""}
        <span class="rchip">${pill(c)}</span>
      </span>
    </button>`).join("") || `<p class="empty">${ui.role === "app" ? "You have no requests yet." : "No cases to show. Select Show closed cases to see finished ones."}</p>`;
  return `<div class="ph"><div><h1>${head}</h1><p>${sub}</p></div>
      ${ui.role === "ame" ? `<div class="acts"><button class="primary" data-act="new" id="newCase">${ico("plus")}New case</button></div>` : ""}</div>
    <div class="split">
    <section class="card sticky" aria-label="${head}">
      ${ui.role !== "app" ? `<div class="listhead"><label class="chk"><input type="checkbox" id="showClosed" ${ui.showClosed ? "checked" : ""}>Show closed cases</label><span class="muted">${cs.length} shown</span></div>` : ""}

function profile(id, own) {
  const [n, lic] = APPLICANTS[id], [yob, ph, pref] = PROFILE[id];
  const cs = S.cases.filter(c => c.appId === id && c.issuedAt).sort((a, b) => b.id.localeCompare(a.id));
  const cids = new Set(cs.map(c => c.id));
  const ev = S.audit.filter(a => a.pid === id || cids.has(a.caseId)).slice(-8).reverse();
  let h = `<div class="dhead"><span class="av" aria-hidden="true">${esc(initials(n))}</span><h2>${own ? "Captain " : ""}${esc(n)}</h2><span class="st s-issued">Simulated patient</span></div>
  <p class="muted">A made-up pilot for this prototype, not a real person.</p>
  <div class="meta" id="pmeta">
    <div><b>Licence number</b>${esc(lic)}</div><div><b>Licence type</b>${LICTYPE[lic.split("-")[0]]}</div>
    <div><b>Medical class (latest request)</b>${cs.length ? esc(cs[0].cls) : "—"}</div><div><b>Year of birth</b>${yob}</div>
    <div><b>Mobile</b>+254 7•• ••• ${ph}</div><div><b>Preferred contact</b>${pref}</div><div><b>AME</b>Dr L. Kamau</div>
  </div>
  <h3>Evidence requests</h3>`;
  h += cs.length ? `<div class="tw"><table id="pCases" class="stack"><thead><tr><th>Case</th><th>Issued</th><th>Evidence items</th><th>Status</th></tr></thead><tbody>
    ${cs.map(c => `<tr>${td("Case", `<a href="#" data-act="goto" data-id="${c.id}">${c.id}</a>`, "ttl")}${td("Issued", fmtD(c.issuedAt))}${td("Evidence items", c.items.map(i => esc(i.type)).join("<br>"))}${td("Status", pill(c))}</tr>`).join("")}
    </tbody></table></div>` : '<p class="empty">No requests issued.</p>';
  h += `<h3>Who has worked on this record</h3>${ev.length ? `<ul class="muted" id="pLog">${ev.map(a => `<li>${fmt(a.at)} · ${esc(a.role)}${a.who ? " " + esc(a.who) : ""}: ${esc(a.action)}${a.caseId ? " (" + a.caseId + ")" : ""}</li>`).join("")}</ul>` : '<p class="muted" id="pLog">No activity in this demo session yet.</p>'}`;
  h += `<section class="card never mt" id="notHeld"><h3>Not held in RECM</h3><ul>
    <li>${ico("ban")}<span>Examination findings, test results and diagnoses. They stay in the AME's medical record and the formal KCAA file.</span></li>
    <li>${ico("ban")}<span>Fitness-to-fly decisions and certificate status.</span></li>
    <li>${ico("ban")}<span>Airline or employer details. ${own ? "Your" : "The pilot's"} airline cannot see this page.</span></li></ul></section>`;
  if (own) h += note("info", "Who can see this page: you, your AME (Dr L. Kamau) and the clinic coordinator. To correct a detail, contact the clinic coordinator.", "pPriv");
  return h;
}
function openPilot(id) {
  if (ui.role === "app") { ui.tab = "profile"; render(); window.scrollTo(0, 0); return; }
  ui.tab = "pilots"; ui.pilot = id; tick(1); log(`Opened pilot profile ${APPLICANTS[id][1]}`, "", id); render();
  if (window.matchMedia("(max-width:1279px)").matches) { const d = $("#profile"); if (d) d.scrollIntoView({ block: "start" }); }

function detail(c) {
  if (!c.issuedAt) return ui.role === "ame" ? draftForm(c) : `<div class="dhead"><h2>${c.id}</h2>${pill(c)}</div>${note("info", "Draft: only the AME can complete and issue this request.")}`;
  const st = status(c), app = ui.role === "app";
  let h = `<div class="dhead"><h2>${c.id}</h2>${pill(c)}${isOverdue(c) ? ' <span class="over">Overdue</span>' : ""}</div>`;
  if (app) h += `<div class="explain" id="explain">${esc(STATUS[st][2])}</div>`;
  h += `<div class="meta">
    <div><b>Applicant</b>${esc(appName(c))} · ${esc(appLic(c))}${app ? "" : ` <a href="#" data-act="openPilot" data-pid="${c.appId}" id="profLink">Open profile</a>`}</div><div><b>Medical class</b>${esc(c.cls)}</div>
    <div><b>Requested by</b>${esc(c.ame)}</div>${app ? "" : `<div><b>Owner</b>${esc(c.owner)}</div>`}
    <div><b>Issued</b>${fmt(c.issuedAt)}</div><div><b>Due</b>${fmtD(c.due)}</div>
    ${app ? "" : `<div><b>Follow-up contacts</b><span id="fu">${c.followUps}</span></div>`}${c.closedAt ? `<div><b>Closed</b>${fmt(c.closedAt)}</div>` : ""}
  </div>`;
  h += journeyHtml(c);
  if (ui.msg && ui.msg.caseId === c.id) h += note(ui.msg.kind, ui.msg.html, "umsg");
  h += `<h3>Evidence checklist</h3><div class="tw"><table id="items" class="stack"><thead><tr><th>#</th><th>Evidence</th><th>From</th><th>State</th><th>Documents</th>${app ? "" : "<th>Action</th>"}</tr></thead><tbody>`;
  c.items.forEach(it => {
    const docs = it.docs.map(d => `<div>${esc(d.file)} <span class="tag ${d.superseded ? "t-sup" : "t-cur"}">v${d.ver}${d.superseded ? " superseded" : ""}</span><div class="muted">Received ${fmt(d.at)} · ${esc(d.receipt)}${app ? "" : " · issuer " + esc(d.issuer) + " · dated " + fmtD(d.docDate)}</div></div>`).join("") || '<span class="muted">Nothing received</span>';
    let act = "";
    if (!app && !c.closedAt && ui.role === "ame" && it.state === "received") {
      act = `<select id="rsn-${it.n}" aria-label="Reason for item ${it.n}"><option value="">Reason (needed for incomplete / more info)</option>${REASONS.map(r => `<option>${r}</option>`).join("")}</select>
        <div class="acts"><button class="primary" data-act="rev" data-v="complete" data-n="${it.n}">Mark complete</button><button data-act="rev" data-v="incomplete" data-n="${it.n}">Incomplete</button><button data-act="rev" data-v="moreinfo" data-n="${it.n}">More info needed</button></div>`;
    } else if (!app && ui.role === "coord" && it.state === "received") act = '<span class="muted">Waiting for AME review</span>';
    h += `<tr data-n="${it.n}">${td("Item", it.n)}${td("Evidence", esc(it.type), "ttl")}${td("From", esc(it.party))}${td("State", `${ITEMSTATE[it.state]}${it.reason ? `<div class="muted">Reason: ${esc(it.reason)}</div>` : ""}`, "ist")}${td("Documents", docs)}${app ? "" : td("Action", act)}</tr>`;
  });
  h += `</tbody></table></div>`;
  if (app && !c.closedAt) h += uploadForm(c);
  if (ui.role === "coord" && !c.closedAt) h += `<div class="acts"><button data-act="fu" id="fuBtn">Log follow-up contact</button><span class="muted">Records that you contacted the applicant or provider. No message content is stored.</span></div>`;
  if (ui.role === "ame" && st === "ready") h += `<div class="acts"><button class="gold" data-act="close" id="closeBtn">Record: submitted through the existing KCAA channel, close case</button></div><p class="muted mt">RECM does not submit to KCAA. The AME uses the existing formal process, then records it here.</p>`;
  if (!app) {
    h += rulesHtml(c);
    const ev = S.audit.filter(a => a.caseId === c.id).slice(-6).reverse();
    h += `<details class="how" id="actFold"><summary>Recent activity · ${ev.length} ${ev.length === 1 ? "entry" : "entries"}</summary>${ev.length ? `<ul class="muted" id="caseLog">${ev.map(a => `<li>${fmt(a.at)} · ${esc(a.role)}: ${esc(a.action)}</li>`).join("")}</ul>` : '<p class="muted">No activity in this demo session yet.</p>'}</details>`;
  }
  h += boundary(true);
  return h;
}

function uploadForm(c) {
  const open = c.items.filter(i => i.state !== "complete" && i.state !== "received");
  if (!open.length) return note("info", "Nothing to send for this request right now.");
  const u = ui.up && ui.up.caseId === c.id ? ui.up : {};
  return `<div class="upload" id="upload"><h3>Send a document</h3>
    <p class="muted">Demo: pick one of the sample files below. No real file leaves your browser.</p>
    <div class="grid2">
      <div><label for="upItem">For checklist item</label><select id="upItem">${open.map(i => `<option value="${i.n}" ${u.n === i.n ? "selected" : ""}>${i.n}. ${esc(i.type)}</option>`).join("")}</select></div>
      <div><label for="upFile">Document</label><select id="upFile"><option value="">Choose a sample file</option>${SAMPLES.map(s => `<option value="${s.id}" ${u.sid === s.id ? "selected" : ""}>${esc(s.file)}${s.hint ? " (" + s.hint + ")" : ""}</option>`).join("")}</select></div>
      <div><label for="upRef">Confirm identifier 1: case reference</label><input id="upRef" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="RECM-2026-…" value="${esc(u.ref || "")}"></div>
      <div><label for="upLic">Confirm identifier 2: licence number</label><input id="upLic" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="e.g. CPL-K-…" value="${esc(u.lic || "")}"></div>
    </div>
    <p class="muted mt">Both are printed on your request letter: ${c.id} and ${esc(appLic(c))}.</p>
    <label class="chk"><input type="checkbox" id="upFail" ${u.fail ? "checked" : ""}>Demo only: simulate a network failure</label>

function heroDash(open, coord) {
  const od = open.filter(isOverdue);
  if (!od.length) return `<section class="hero" id="hero" aria-label="Needs action today"><h2 id="tOver"><span class="n vh">0</span>Nothing is overdue</h2><p>Every open case is within its due date.</p></section>`;
  const c = od[0], it = c.items.find(i => i.state !== "complete");
  const more = od.length > 1 ? ` ${od.length - 1} more overdue.` : "";
  return `<section class="hero" id="hero" aria-label="Needs action today">
    <h2 id="tOver"><span class="n">${od.length}</span> ${od.length === 1 ? "case is" : "cases are"} overdue</h2>
    <p><b>${c.id}</b> (${esc(appName(c))}): ${esc(it.type)} is still ${ITEMSTATE[it.state].toLowerCase()}. Due ${fmtD(c.due)}.${more}</p>
    <div class="acts">${coord ? `<button class="light" data-act="fu" data-id="${c.id}">Log follow-up for ${c.id}</button>` : `<button class="light" data-act="goto" data-id="${c.id}">Open ${c.id}</button>`}</div>
  </section>`;
}

function viewDash() {
  const open = S.cases.filter(c => c.issuedAt && !c.closedAt);
  const items = []; open.forEach(c => c.items.forEach(i => items.push([c, i])));
  const cnt = st => items.filter(([, i]) => st.includes(i.state)).length;
  const nReady = open.filter(c => status(c) === "ready").length;
  // Four counts; each one filters the item table below (select again to show all). Overdue is in the hero, quarantine in its own card.
  const tiles = [["tReq", cnt(["requested"]), "Outstanding items (requested)", "", ([, i]) => i.state === "requested", "Outstanding items"],
    ["tRec", cnt(["received"]), "Received, awaiting AME review", "", ([, i]) => i.state === "received", "Items awaiting AME review"],
    ["tMore", cnt(["incomplete", "moreinfo"]), "Incomplete or more info needed", "", ([, i]) => ["incomplete", "moreinfo"].includes(i.state), "Items incomplete or needing more info"],
    ["tReady", nReady, "Cases ready for authorised submission", nReady ? "cool" : "", ([c]) => status(c) === "ready", "Items in cases ready for submission"]];
  const f = tiles.find(t => t[0] === ui.dfilter);
  const out = items.filter(f ? f[4] : ([, i]) => i.state !== "complete").sort((a, b) => (a[0].due || 0) - (b[0].due || 0));
  const coord = ui.role === "coord";
  const due = []; open.forEach(c => rules(c).forEach(x => { if (x.state === "on") due.push([c, x]); }));
  due.sort((a, b) => a[1].t - b[1].t);
  return `<div class="ph"><div><h1>Dashboard</h1><p>${open.length} open cases as of ${fmtD(S.clock)}. Every number below follows the open cases.</p></div></div>
  ${heroDash(open, coord)}
  <div class="tiles" id="tiles" role="group" aria-label="Counts. Select one to filter the item table">${tiles.map(t => `<button class="tile ${t[3]}" id="${t[0]}" data-act="dfilter" data-f="${t[0]}" aria-pressed="${ui.dfilter === t[0]}" aria-controls="outCard"><span class="n">${t[1]}</span><span class="k">${t[2]}</span><span class="f">${ui.dfilter === t[0] ? "Showing these · show all" : "Show these"}</span></button>`).join("")}</div>
  <section class="card" id="ruleCard"><h2>Reminders and escalations that apply now</h2><p class="muted">Simulated: RECM shows which rule applies and to whom. No SMS or email is sent.</p>
  ${due.length ? `<div class="tw"><table id="ruleDue" class="stack"><thead><tr><th>Case</th><th>Applicant</th><th>Rule</th><th>Goes to</th><th>Since</th></tr></thead><tbody>
  ${due.map(([c, x]) => `<tr data-case="${c.id}" data-rule="${x.r.id}">${td("Case", `<a href="#" data-act="goto" data-id="${c.id}">${c.id}</a>`, "ttl")}${td("Applicant", esc(appName(c)))}${td("Rule", `${x.r.id} ${esc(x.r.name)}`)}${td("Goes to", esc(x.r.to(c)))}${td("Since", fmt(x.t))}</tr>`).join("")}
  </tbody></table></div>` : '<p class="empty">No rule applies now.</p>'}</section>
  <section class="card mt" id="outCard"><div class="cardhead"><h2 id="outH">${f ? f[5] : "Items not yet complete"}</h2>${f ? '<button class="quiet" data-act="dfilter" data-f="" id="showAll">Show all items</button>' : ""}</div>${out.length ? `<div class="tw"><table id="outTable" class="stack"><thead><tr><th>Case</th><th>Applicant</th><th>Item</th><th>State</th><th>Owner</th><th>Due</th><th>Days open</th>${coord ? "<th>Action</th>" : ""}</tr></thead><tbody>
  ${out.map(([c, i]) => `<tr data-case="${c.id}">${td("Case", `<a href="#" data-act="goto" data-id="${c.id}">${c.id}</a>`, "ttl")}${td("Applicant", esc(appName(c)))}${td("Item", esc(i.type))}${td("State", ITEMSTATE[i.state])}${td("Owner", esc(c.owner))}${td("Due", `${fmtD(c.due)}${isOverdue(c) ? ' <span class="over">Overdue</span>' : ""}`)}${td("Days open", Math.floor((S.clock - i.requestedAt) / DAY))}${coord ? td("Action", `<button data-act="fu" data-id="${c.id}">Log follow-up</button>`) : ""}</tr>`).join("")}
  </tbody></table></div>` : `<p class="empty">${f ? "No items match this count." : "No open items. Every item in an open case is complete."}</p>`}</section>
  <section class="card mt"><h2>Quarantine<span class="count" id="tQ"><span class="n">${S.quarantine.length}</span><span class="vh"> files</span></span></h2><p class="muted">Files whose identifiers did not match the case. They are not attached to any case and no receipt was issued.</p>
  ${S.quarantine.length ? `<div class="tw"><table id="qTable" class="stack"><thead><tr><th>Time</th><th>Claimed case</th><th>File</th><th>Reason</th>${coord ? "<th>Action</th>" : ""}</tr></thead><tbody>${S.quarantine.map((q, k) => `<tr>${td("Time", fmt(q.at))}${td("Claimed case", q.caseId, "ttl")}${td("File", esc(q.file))}${td("Reason", esc(q.reason))}${coord ? td("Action", `<button data-act="qret" data-k="${k}">Return to applicant</button>`) : ""}</tr>`).join("")}</tbody></table></div>` : '<p class="empty" id="qEmpty">Nothing in quarantine.</p>'}</section>`;
}

function viewMeasures() {
  const m = measures();

  return `<div class="ph"><div><h1>Measures</h1><p>The four measures from the report, calculated live from the demo data.</p></div></div>
  ${note("warn", "Simulated data. These numbers show how the report's measures are calculated (Appendix D). They are not results.", "mNote")}
  <div class="mgrid">
    <section class="card measure" id="mFp"><h2>First-pass completeness</h2><div class="v">${m.fp == null ? "—" : m.fp + "%"}</div><div class="sub">${m.fpN} of ${m.fpD} reviewed packages complete at first review</div>${how("Eligible packages complete at first review ÷ all eligible packages reviewed × 100")}</section>
    <section class="card measure" id="mRr"><h2>Request-to-receipt time</h2><div class="v">${m.medDays == null ? "—" : m.medDays + " days"}</div><div class="sub">median; range ${m.minDays}–${m.maxDays} days; ${m.nDays} items</div>${how("Time from request issue to first receipt of each item; median and range")}</section>
    <section class="card measure" id="mWc"><h2>Wrong-case rate</h2><div class="v">${m.wrongPct == null ? "—" : m.wrongPct + "%"}</div><div class="sub">${m.wrongN} of ${m.subs} submitted files quarantined</div>${how("Items quarantined for applicant or case mismatch ÷ all submitted items × 100")}</section>
    <section class="card measure" id="mFu"><h2>Follow-up contacts per case</h2><div class="v">${m.fuPer == null ? "—" : m.fuPer}</div><div class="sub">${m.fuN} contacts over ${m.fuD} issued cases</div>${how("Logged follow-up contacts ÷ issued cases")}</section>
  </div>`;
}

function viewAudit() {
  const rows = [...S.audit].reverse();
  return `<div class="ph"><div><h1>Audit log</h1><p>Who did what and when. IDs and statuses only: no medical content and no message text are stored.</p></div></div>
  <section class="card"><div class="tw"><table id="auditTable" class="stack"><thead><tr><th>Time</th><th>Role</th><th>Person</th><th>Case</th><th>Action</th></tr></thead><tbody>
  ${rows.map(a => `<tr>${td("Time", fmt(a.at))}${td("Role", esc(a.role))}${td("Person", esc(a.who))}${td("Case", esc(a.caseId))}${td("Action", esc(a.action), "ttl")}</tr>`).join("")}</tbody></table></div></section>`;

// ---------- actions ----------
function pick(id) {
  ui.sel = id; ui.msg = null; ui.formErr = []; ui.up = null; ui.confirmDel = null;
  const c = byId(id);
  if (ui.role === "app" && c.issuedAt && !c.viewed) { c.viewed = true; tick(1); log("Applicant opened the request", c.id); }
  render();
  // below 1280 px the case panel sits under the list: bring it into view
  if (ui.tab === "cases" && window.matchMedia("(max-width:1279px)").matches) { const d = $("#detail"); if (d) d.scrollIntoView({ block: "start" }); }
}
function newCase() {
  S.seq += 1;
  const c = kase(S.seq, "", "Class 1", S.clock, null, null, [], { owner: "", viewed: false });
  S.cases.push(c); tick(1); log("Draft case created", c.id); ui.sel = c.id; ui.formErr = []; ui.confirmDel = null; render();
  if (window.matchMedia("(max-width:1279px)").matches) { const d = $("#detail"); if (d) d.scrollIntoView({ block: "start" }); }
}
function readDraft(c) {
  const a = $("#fApp"); if (!a) return;
  c.appId = a.value; c.cls = $("#fCls").value; c.owner = $("#fOwner").value;
  const d = $("#fDue").value; c.due = d ? new Date(d + "T17:00:00").getTime() : null;
}
function issue(c) {
  readDraft(c);
  const e = [];
  if (!c.appId) e.push("Choose the applicant.");
  if (!c.items.length) e.push("Add at least one evidence item.");
  if (!c.owner) e.push("Name an owner for the case.");
  if (!c.due) e.push("Set a due date.");
  else if (c.due < S.clock) e.push("The due date must be in the future.");
  ui.formErr = e;
  if (e.length) { toast(`Not issued: ${e.length} ${e.length === 1 ? "thing is" : "things are"} missing.`); log("Issue refused: checklist, owner or due date missing", c.id); render(); const b = $("#formErrBox"); if (b) b.focus(); return; }
  tick(2); c.issuedAt = S.clock; c.viewed = false; c.items.forEach(i => { i.requestedAt = S.clock; });
  log(`Request issued with ${c.items.length} item(s); applicant notified`, c.id); toast("Request issued. The applicant gets a secure notification."); render();
}
async function send(c) {
  const n = +$("#upItem").value, it = c.items.find(i => i.n === n), sid = $("#upFile").value, ref = $("#upRef").value.trim().toUpperCase(), lic = $("#upLic").value.trim().toUpperCase(), fail = $("#upFail").checked;
  if (!sid) { ui.msg = { caseId: c.id, kind: "bad", html: "Choose a document first." }; render(); return; }
  if (ref !== c.id || lic !== appLic(c)) {
    ui.msg = { caseId: c.id, kind: "bad", html: "<b>Not sent.</b> The case reference or licence number does not match this request. Check both and try again." };
    tick(1); log("Upload blocked: identifiers typed do not match the case", c.id); render(); return;
  }
  const smp = SAMPLES.find(s => s.id === sid);
  ui.up = { caseId: c.id, n, sid, ref, lic, fail };   // keep the form filled while it redraws
  ui.busy = true; ui.msg = null; render();
  await sleep(DELAY);
  ui.busy = false; tick(2);
  if (fail) {
    ui.msg = { caseId: c.id, kind: "bad", html: "<b>Upload failed.</b> The server did not confirm receipt, so nothing was received and no receipt was issued. Your request status has not changed. Please try again." };
    log(`Upload failed for item ${n}: no server confirmation, no receipt`, c.id); render(); return;
  }
  S.subs += 1;
  if (smp.lic !== appLic(c)) {
    S.wrong += 1;
    S.quarantine.push({ at: S.clock, caseId: c.id, file: smp.file, reason: "Licence on the document does not match the case" });
    ui.msg = { caseId: c.id, kind: "warn", html: "<b>Held for checking, not added to your case.</b> The identifiers on this document do not match your request. The clinic coordinator will contact you. No receipt was issued." };
    log(`File quarantined for item ${n}: identifiers on document do not match case`, c.id); render(); return;
  }
  it.docs.forEach(d => { d.superseded = true; });
  const rc = "R-" + (++S.rcpt), ver = it.docs.length + 1;
  it.docs.push({ file: smp.file.replace(".pdf", ver > 1 ? "_v" + ver + ".pdf" : ".pdf"), ver, at: S.clock, issuer: smp.issuer, docDate: smp.docDate, superseded: false, receipt: rc });
  if (!it.firstReceivedAt) it.firstReceivedAt = S.clock;
  it.state = "received"; it.reason = ""; ui.up = null;
  ui.msg = { caseId: c.id, kind: "ok", html: `<b>Received.</b> Receipt <span id="rcpt">${rc}</span> · ${fmt(S.clock)} · item ${n} (${esc(it.type)}), version ${ver}. The server confirmed receipt. This is not a medical decision.` };
  log(`Item ${n} received (v${ver}), receipt ${rc}`, c.id); render();
}
function review(c, n, v) {
  const it = c.items.find(i => i.n === n), rs = $("#rsn-" + n).value;
  if (v !== "complete" && !rs) { toast("Choose a reason first. The applicant will see it."); return; }
  if (!it.firstReview) it.firstReview = v === "complete" ? "ok" : "not";
  it.state = v; it.reason = v === "complete" ? "" : rs; tick(2); it.reviewedAt = S.clock;
  if (v !== "complete") it.returns += 1;
  log(`Item ${n} marked ${ITEMSTATE[v].toLowerCase()}${rs && v !== "complete" ? " (reason given)" : ""}`, c.id);
  toast(`Item ${n}: ${ITEMSTATE[v]}.`); render();
}

document.addEventListener("click", e => {
  const rb = e.target.closest(".roles button"); if (rb) { ui.role = rb.dataset.role; ui.msg = null; ui.formErr = []; ui.sel = null; ui.confirmDel = null; render(); return; }
  const tabsEl = $("#tabs");
  if (e.target.closest("#moreBtn")) { const o = tabsEl.classList.toggle("open"); $("#moreBtn").setAttribute("aria-expanded", o); return; }
  if (tabsEl.classList.contains("open") && !e.target.closest("#tabs")) { tabsEl.classList.remove("open"); $("#moreBtn").setAttribute("aria-expanded", "false"); }
  const tb = e.target.closest("#tabs button[data-tab]"); if (tb) { ui.tab = tb.dataset.tab; render(); window.scrollTo(0, 0); return; }
  const a = e.target.closest("[data-act]"); if (!a) return;
  const act = a.dataset.act, c = ui.sel ? byId(ui.sel) : null;
  if (act === "pick") pick(a.dataset.id);
  else if (act === "new") newCase();
  else if (act === "addItem") { readDraft(c); const v = $("#fAdd").value; if (v === "") { toast("Choose an evidence item to add."); return; } const x = CATALOGUE[+v]; c.items.push(item(x[0], x[1], null, null, "requested")); c.items.forEach((i, k) => i.n = k + 1); render(); }
  else if (act === "rmItem") { readDraft(c); c.items = c.items.filter(i => i.n !== +a.dataset.n); c.items.forEach((i, k) => i.n = k + 1); render(); }
  else if (act === "issue") issue(c);
  else if (act === "delDraft") { readDraft(c); ui.confirmDel = c.id; render(); const d = $("#delConfirm"); if (d) d.scrollIntoView({ block: "nearest" }); }
  else if (act === "delDraftNo") { ui.confirmDel = null; render(); }
  else if (act === "delDraftYes") { S.cases = S.cases.filter(x => x !== c); log("Draft deleted", c.id); ui.sel = null; ui.confirmDel = null; render(); }
  else if (act === "send") { if (!ui.busy) send(c); }
  else if (act === "rev") review(c, +a.dataset.n, a.dataset.v);
  else if (act === "fu") { const k = a.dataset.id ? byId(a.dataset.id) : c; k.followUps += 1; tick(1); log("Follow-up contact logged", k.id); toast(`Follow-up contact logged for ${k.id}.`); render(); }
  else if (act === "close") { tick(2); c.closedAt = S.clock; log("Outcome recorded: submitted through the existing KCAA channel; case closed", c.id); toast("Case closed. RECM did not submit anything to KCAA."); render(); }
  else if (act === "qret") { const q = S.quarantine.splice(+a.dataset.k, 1)[0]; tick(1); log("Quarantined file returned to applicant, not attached", q.caseId); toast("File returned to the applicant. It was not attached to any case."); render(); }
  else if (act === "goto") { e.preventDefault(); ui.tab = "cases"; ui.showClosed = !!byId(a.dataset.id).closedAt; pick(a.dataset.id); }
  else if (act === "openPilot" || act === "pickPilot") { e.preventDefault(); openPilot(a.dataset.pid); }
  else if (act === "wt") goWt(0);
  else if (act === "dfilter") { ui.dfilter = a.dataset.f && ui.dfilter !== a.dataset.f ? a.dataset.f : null; render(); if (ui.dfilter) { const o = $("#outCard"); if (o && o.getBoundingClientRect().top > innerHeight - 120) o.scrollIntoView({ block: "start" }); } }
});
document.addEventListener("keydown", e => {
  if (e.key === "Escape" && $("#tabs").classList.contains("open")) { $("#tabs").classList.remove("open"); $("#moreBtn").setAttribute("aria-expanded", "false"); $("#moreBtn").focus(); }
});
document.addEventListener("change", e => {
  if (e.target.id === "showClosed") { ui.showClosed = e.target.checked; render(); }
});
$("#resetBtn").addEventListener("click", () => { S = seed(); Object.assign(ui, { tab: "project", sel: null, showClosed: false, msg: null, busy: false, formErr: [], wt: -1, up: null, confirmDel: null, pilot: null, dfilter: null }); render(); toast("Demo reset. All data are simulated."); });

function goWt(i) {
  ui.wt = i; const s = WT[i]; ui.role = s.role; ui.tab = s.tab; ui.msg = null; ui.formErr = []; ui.sel = null; ui.confirmDel = null;
  if (s.pilot) openPilot(s.pilot); else if (s.sel) pick(s.sel); else render();
}
function renderWt() {
  const w = $("#wt");
  if (ui.wt < 0) { w.hidden = true; return; }
  w.hidden = false;
  w.innerHTML = `<div class="step">Walkthrough · step ${ui.wt + 1} of ${WT.length}</div><div class="dots" aria-hidden="true">${WT.map((_, k) => `<i${k <= ui.wt ? ' class="on"' : ""}></i>`).join("")}</div><p id="wtText">${esc(WT[ui.wt].t)}</p>
    <div class="acts"><button id="wtClose" class="quiet">Close</button><span class="acts"><button id="wtBack" ${ui.wt ? "" : 'disabled title="This is the first step"'}>Back</button><button class="primary" id="wtNext">${ui.wt === WT.length - 1 ? "Finish" : "Next"}</button></span></div>`;
}
document.addEventListener("click", e => {
  const t = e.target.closest("button"); if (!t) return;
  if (t.id === "wtBtn") goWt(0);
  else if (t.id === "wtClose") { ui.wt = -1; renderWt(); }
  else if (t.id === "wtBack" && ui.wt > 0) goWt(ui.wt - 1);
  else if (t.id === "wtNext") { if (ui.wt < WT.length - 1) goWt(ui.wt + 1); else { ui.wt = -1; renderWt(); } }
});

render();
</script>
</body>
</html>
